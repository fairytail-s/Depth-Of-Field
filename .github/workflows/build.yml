name: Build Depth of Field Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Configure
        run: >-
          xmake f -y -p android -a arm64-v8a -m release
          --ndk=${{ steps.ndk.outputs.ndk-path }} --ndk_sdkver=28

      - name: Build
        run: xmake -y DepthOfField

      - name: Check the binary
        run: |
          BIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SO=build/android/arm64-v8a/release/DepthOfField.so
          "$BIN/llvm-readelf" -d "$SO" | grep -q 'libpreloader.so' || { echo "libpreloader.so is not a dependency"; exit 1; }
          "$BIN/llvm-nm" -D --defined-only "$SO" | grep -q PLGetModRegistration || { echo "PLGetModRegistration is not exported"; exit 1; }
          ls -l "$SO"

      - name: Package
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp build/android/arm64-v8a/release/DepthOfField.levipack "dist/DepthOfField-${VERSION}.levipack"
          cp "dist/DepthOfField-${VERSION}.levipack" "dist/DepthOfField-${VERSION}.zip"
          if unzip -l "dist/DepthOfField-${VERSION}.zip" | grep -q libpreloader; then echo "libpreloader.so is in the package"; exit 1; fi
          unzip -l "dist/DepthOfField-${VERSION}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DepthOfField-Android
          path: |
            build/android/arm64-v8a/release/DepthOfField.so
            dist/DepthOfField-*.levipack
            dist/DepthOfField-*.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DepthOfField-*.zip
            dist/DepthOfField-*.levipack
